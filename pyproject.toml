[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultlens"
version = "0.1.0"
description = "Local-first search workbench for markdown vaults: Elasticsearch, optional LLM answers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "elasticsearch>=8.15,<9",   # major must match the Elasticsearch server image (see .env.example)
  "langchain-core>=0.3",
  "langchain-google-genai>=2.0",
  "langchain-groq>=0.2",
  "langchain-ollama>=0.2",
  "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vaultlens = "vaultlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vaultlens = ["search/mappings/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: needs a running Elasticsearch (ES_URL, default http://localhost:9200); skipped otherwise"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
